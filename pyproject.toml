[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-screen-translator"
version = "0.1.0"
description = "Real-time context-aware English-to-Vietnamese screen translator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]
capture = []
ocr = []
translation = []
desktop = []

[tool.hatch.build.targets.wheel]
packages = ["src/ai_screen_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
